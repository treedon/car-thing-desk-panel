# Desk panel: Wi-Fi client through a USB adapter on the OTG hub.
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_WLAN=y
# TP-Link Archer TX10UB Nano (RTL8851BU)
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_RTW89=m
CONFIG_RTW89_8851BU=m
# MT7921AU adapters (e.g. Brostrend AX9L), the safer fallback
CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_MT7921U=m
