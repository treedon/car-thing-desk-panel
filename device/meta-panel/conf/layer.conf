# meta-panel: the desk panel on top of yocto-superbird's kiosk example.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "panel"
BBFILE_PATTERN_panel = "^${LAYERDIR}/"
BBFILE_PRIORITY_panel = "10"
LAYERDEPENDS_panel = "core"
LAYERSERIES_COMPAT_panel = "scarthgap wrynose"
