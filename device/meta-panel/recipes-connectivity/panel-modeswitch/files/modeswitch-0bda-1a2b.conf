# TP-Link Archer TX10UB Nano (RTL8851BU) in its Realtek driver-disk mode.
# The target is the Wi-Fi ID listed for it in the kernel's rtw8851bu table.
# (usb-modeswitch-data has an entry for 0bda:1a2b too, but for a D-Link
# DWA-171 with target 2001:331d, so its success check would be wrong here.)
TargetVendor=0x3625
TargetProduct=0x010b
StandardEject=1
