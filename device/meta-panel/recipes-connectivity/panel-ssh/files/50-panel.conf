# Desk panel SSH. Over Wi-Fi only the key provision.sh installs logs in. The
# dev image's empty root password still works over the USB cable: the device
# is 10.42.1.<n*8+2> there, n taken from its serial, so match the whole range.
# That is how Back-held recovery gets in. sshd_config includes this file first,
# so these values win.
AuthorizedKeysFile .ssh/authorized_keys /opt/panel/authorized_keys
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no

Match LocalAddress 10.42.1.0/24
    PasswordAuthentication yes
    PermitEmptyPasswords yes
