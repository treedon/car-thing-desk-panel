<!doctype html>
<!-- Shown instead of the panel when Back is held at power-on (panel-usb-mode). -->
<html><head><meta charset="utf-8"><title>Recovery</title>
<style>
  html, body { margin: 0; width: 800px; height: 480px; background: #000; color: #e8e8e8;
               font: 28px/1.4 sans-serif; }
  main { padding: 64px 72px; }
  h1 { font-size: 44px; margin: 0 0 24px; font-weight: 600; }
  p { margin: 0 0 12px; color: #a8a8a8; }
  code { color: #e8e8e8; }
</style></head>
<body><main>
  <h1>Recovery: USB networking</h1>
  <p>Connect the USB cable to the Mac, then <code>adb shell</code>,<br>or <code>device/scripts/provision.sh --tethered</code></p>
  <p>Restart without holding Back to return to the panel.</p>
</main></body></html>
