<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude Panel</title>
  <script src="./panel-config.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="edge" class="edge"></div>
  <div id="banner" class="banner">Mac offline. Reconnecting…</div>
  <div id="toast" class="toast"></div>
  <!-- The answered-but-not-yet-typed indicator. It lives outside #app because
       every render swaps that subtree's innerHTML, which would restart its
       animation — and a ring that restarts every daemon event is not a wait. -->
  <div id="pending" class="pending">
    <svg class="pendring" viewBox="0 0 24 24">
      <circle class="pendtrack" cx="12" cy="12" r="10" />
      <circle class="pendarc" cx="12" cy="12" r="10" />
    </svg>
    <span class="pendlabel"></span>
  </div>
  <!-- The focus timer's countdown on every screen but its own (Tasks page). -->
  <div id="focus-chip" class="focus-chip"></div>
  <!-- Black over everything while the screen sleeps (display.js). -->
  <div id="screen-dark"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
